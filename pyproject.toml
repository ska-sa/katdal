[build-system]
requires = [
        "setuptools>=45",
        "setuptools_scm[toml]>=6.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "katdal"
description = "Karoo Array Telescope Data Access Library for interacting with data sets in the MeerKAT Visibility Format (MVF)"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Ludwig Schwardt", email = "ludwig@ska.ac.za"}
]
keywords = ["meerkat", "ska"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Astronomy",
]
requires-python = ">=3.6"
dependencies = [
    "numpy >= 1.12.0",
    "katpoint >= 0.9, < 1",
    "h5py >= 2.3",
    "numba",
    "katsdptelstate[rdb] >= 0.10",
    "dask[array] >= 2.7.0",
    "requests >= 2.18.0",
    "pyjwt >= 2",
    "cityhash >= 0.2.2",
    "packaging",
]
dynamic = ["version", "readme"]

[project.optional-dependencies]
ms = ["python-casacore >= 2.2.1"]
s3 = []
s3credentials = ["botocore"]
test = [
    "cryptography",
    "pytest",
    "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/ska-sa/katdal"
Documentation = "https://katdal.readthedocs.io"
Repository = "https://github.com/ska-sa/katdal.git"
Issues = "https://github.com/ska-sa/katdal/issues"
Changelog = "https://github.com/ska-sa/katdal/blob/master/NEWS.rst"

[project.scripts]
"mvf_copy.py" = "katdal.scripts.mvf_copy:main"
"mvf_download.py" = "katdal.scripts.mvf_download:main"
"mvftoms.py" = "katdal.scripts.mvftoms:main"



[tool.setuptools.dynamic]
readme = {file = ["README.rst", "NEWS.rst"]}

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
# XXX Change to version_file when requires-python = ">=3.8" (and setuptools_scm>=8.0)
write_to = "src/katdal/_version.py"



[tool.darglint]
docstring_style = "numpy"
strictness = "long"
